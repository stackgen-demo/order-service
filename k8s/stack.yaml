# Lean aiden-demo stack: app + single Datadog Agent (APM traces only, US3).
# Secret: kubectl -n aiden-demo create secret generic datadog-secret --from-literal=api-key=<KEY>
# Upgrade from DaemonSet: kubectl -n aiden-demo delete daemonset datadog-agent --ignore-not-found
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiden-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-agent
  namespace: aiden-demo
  labels:
    app: datadog-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
    spec:
      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7
          ports:
            - name: traceport
              containerPort: 8126
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_SITE
              value: us3.datadoghq.com
            - name: DD_HOSTNAME
              value: aiden-demo-agent
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            - name: DD_LOGS_ENABLED
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SERIES
              value: "false"
            - name: DD_ENABLE_PAYLOADS_EVENTS
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-agent
  namespace: aiden-demo
spec:
  selector:
    app: datadog-agent
  ports:
    - port: 8126
      targetPort: traceport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiden-demo
  namespace: aiden-demo
  labels:
    app: aiden-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiden-demo
  template:
    metadata:
      labels:
        app: aiden-demo
    spec:
      containers:
        - name: aiden-demo
          image: ghcr.io/stackgen-demo/order-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /app/data/app.db
            - name: DD_SERVICE
              value: order-service
            - name: DD_ENV
              value: demo
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_TRACE_ENABLED
              value: "true"
            - name: DD_AGENT_HOST
              value: datadog-agent
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aiden-demo
  namespace: aiden-demo
spec:
  selector:
    app: aiden-demo
  ports:
    - port: 80
      targetPort: http
