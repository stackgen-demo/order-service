# Lean aiden-demo stack: app + one Datadog Agent (APM + logs for this namespace, US3).
# Network isolation: kubectl apply -f k8s/network-policy.yaml (included in deploy-aiden-demo-stack.sh).
# Requires EKS VPC CNI with enableNetworkPolicy=true on the cluster.
# The agent is a single Deployment (not DaemonSet). It prefers the same node as aiden-demo
# so hostPath log tailing works without running an agent on every cluster node.
# Secret: DD_API_KEY=<key> ./scripts/apply-datadog-secret.sh
# After switching from DaemonSet: kubectl -n aiden-demo delete daemonset datadog-agent --ignore-not-found
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiden-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: aiden-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-agent
  namespace: aiden-demo
rules:
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-agent
  namespace: aiden-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: aiden-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-agent-logs
  namespace: aiden-demo
data:
  conf.yaml: |
    logs:
      - type: file
        path: /var/log/pods/**/aiden-demo/*.log
        service: order-service
        source: go
        tags:
          - env:demo
      - type: file
        path: /var/log/pods/**/payment-service/*.log
        service: payment-service
        source: nodejs
        tags:
          - env:demo
      - type: file
        path: /var/log/pods/**/product-catalog-service/*.log
        service: product-catalog-service
        source: go
        tags:
          - env:demo
      - type: file
        path: /var/log/pods/**/ad-service/*.log
        service: ad-service
        source: java
        tags:
          - env:demo
      - type: file
        path: /var/log/pods/**/aiden-chaos-monkey/*.log
        service: aiden-chaos-monkey
        source: go
        tags:
          - env:demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-agent
  namespace: aiden-demo
  labels:
    app: datadog-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
    spec:
      serviceAccountName: datadog-agent
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: aiden-demo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7
          ports:
            - name: traceport
              containerPort: 8126
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_SITE
              value: us3.datadoghq.com
            - name: DD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DD_KUBERNETES_KUBELET_NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DD_KUBELET_TLS_VERIFY
              value: "false"
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_ENABLE_PAYLOADS_SERIES
              value: "false"
            - name: DD_ENABLE_PAYLOADS_EVENTS
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
              value: "false"
            - name: DD_COLLECT_KUBERNETES_EVENTS
              value: "false"
            # Lean agent: file logs + APM only — no kubelet / orchestrator / API calls
            # (required when NetworkPolicy blocks control-plane and cross-namespace egress).
            - name: DD_KUBELET_CORE_CHECK
              value: "false"
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT
              value: "0.0.0.0:4317"
            - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT
              value: "0.0.0.0:4318"
          volumeMounts:
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true
            - name: logs-config
              mountPath: /etc/datadog-agent/conf.d/demo_logs.d
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: pointerdir
          hostPath:
            path: /opt/datadog-agent/run
        - name: logpodpath
          hostPath:
            path: /var/log/pods
        - name: logs-config
          configMap:
            name: datadog-agent-logs
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-agent
  namespace: aiden-demo
spec:
  selector:
    app: datadog-agent
  ports:
    - name: traceport
      port: 8126
      targetPort: traceport
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiden-demo
  namespace: aiden-demo
  labels:
    app: aiden-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiden-demo
  template:
    metadata:
      labels:
        app: aiden-demo
      annotations:
        ad.datadoghq.com/aiden-demo.logs: '[{"source":"go","service":"order-service","tags":["env:demo"]}]'
    spec:
      containers:
        - name: aiden-demo
          image: ghcr.io/stackgen-demo/order-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /app/data/app.db
            - name: DD_SERVICE
              value: order-service
            - name: DD_ENV
              value: demo
            - name: DD_VERSION
              value: "1.0.1"
            - name: DD_TRACE_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_AGENT_HOST
              value: datadog-agent
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_TRACE_PROPAGATION_STYLE
              value: "datadog,tracecontext"
            - name: PAYMENT_GRPC_ADDR
              value: "payment-service:50051"
            - name: CATALOG_GRPC_ADDR
              value: "product-catalog-service:3550"
            - name: AD_GRPC_ADDR
              value: "ad-service:8080"
            - name: DEFAULT_PRODUCT_ID
              value: "66VCHSJNUP"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aiden-demo
  namespace: aiden-demo
spec:
  selector:
    app: aiden-demo
  ports:
    - port: 80
      targetPort: http
