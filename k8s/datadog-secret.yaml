# Placeholder Datadog credentials for the aiden-demo stack.
#
# DO NOT commit a real API key. Either:
#   1. Edit api-key below and `kubectl apply -f k8s/datadog-secret.yaml`, or
#   2. Create it imperatively (recommended) instead of using this file:
#        kubectl -n aiden-demo create secret generic datadog-secret \
#          --from-literal=api-key=<YOUR_DATADOG_API_KEY>
#
# Namespace must match k8s/stack.yaml (aiden-demo).
# (namespace: aiden-demo), or the agent cannot read DD_API_KEY.
#
# Get an API key: Datadog → Organization Settings → API Keys (US3 org).
apiVersion: v1
kind: Secret
metadata:
  name: datadog-secret
  namespace: aiden-demo
  labels:
    app.kubernetes.io/part-of: aiden-demo-stack
type: Opaque
stringData:
  # US3 org — get a key at https://us3.datadoghq.com/organization-settings/api-keys
  # Prefer: DD_API_KEY=<key> ./scripts/apply-datadog-secret.sh
  api-key: REPLACE_WITH_DATADOG_API_KEY
